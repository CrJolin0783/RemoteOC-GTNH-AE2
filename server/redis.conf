# Redis configuration for RemoteOC
# This configuration is optimized for caching and performance

# Network settings
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (save data to disk)
save 900 1
save 300 10
save 60 10000

# Append-only file for durability
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client connections
timeout 300
tcp-keepalive 60
maxclients 10000

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Security (require authentication)
# requirepass your_redis_password_here

# Lua scripting
lua-time-limit 5000

# Pub/Sub
notify-keyspace-events ""

# Cluster mode (disabled by default)
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000